version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /
      - /sections/04-ship-it
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ['*']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      workflow-actions:
        patterns: ['*']
