[project]
name = "first-byte-ship-it"
version = "0.1.0"
description = "Deployable course agent for Section 5 of Production Voice AI Agents with LiveKit"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Keep the SDK and Silero plugin on the same validated minor line.
    # Audio turn detection is built into the SDK; no text-model plugin is needed.
    "livekit-agents>=1.8.11,<1.9.0",
    "livekit-plugins-silero>=1.8.11,<1.9.0",
    "moss>=1.23.0,<2.0.0",
    "python-dotenv>=1.2.2",
]
