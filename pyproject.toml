[project]
name = "first-byte"
version = "0.1.0"
description = "Course repo for Production Voice AI Agents with LiveKit"
authors = [
    { name = "Abhimanyu Selvan" },
]
requires-python = ">=3.11,<3.15"
dependencies = [
    # Keep the SDK and Silero plugin on the same validated minor line.
    # Audio turn detection is built into the SDK; no text-model plugin is needed.
    "livekit-agents>=1.8.11,<1.9.0",
    "livekit-plugins-silero>=1.8.11,<1.9.0",
    "moss>=1.23.0,<2.0.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sections"]
